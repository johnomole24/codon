<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#0B0D1E"/>
<link rel="manifest" href="/manifest.json"/>
<title>Codon Trader</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── Reset & tokens ──────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:       #0B0D1E;
  --sidebar:  #0F1225;
  --surface:  #141729;
  --surface2: #1C2040;
  --surface3: #232849;
  --border:   #252B52;
  --accent:   #4C7BF4;
  --accent2:  #6C3BF4;
  --green:    #00C48C;
  --red:      #FF5B5B;
  --yellow:   #F0B90B;
  --text:     #FFFFFF;
  --text2:    #A8AECB;
  --text3:    #5D638A;
  --radius:   14px;
  --sidebar-w:220px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,sans-serif;
  font-size:14px;line-height:1.5;overflow:hidden}
a,button{cursor:pointer;border:none;background:none;color:inherit;font:inherit;text-decoration:none}
input,select{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;outline:none;transition:.2s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--text3)}

/* ── Layout ──────────────────────────────────────────────────────── */
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ─────────────────────────────────────────────────────── */
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  padding:0 0 24px;overflow:hidden;
}
.logo{display:flex;align-items:center;gap:10px;padding:24px 20px 28px}
.logo-icon{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;color:#fff;flex-shrink:0}
.logo-text{font-size:17px;font-weight:800;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-top:1px}

.nav-section{padding:0 12px;margin-bottom:6px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text3);padding:8px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;transition:.15s;margin-bottom:2px}
.nav-item:hover{background:var(--surface2);color:var(--text2)}
.nav-item.active{background:rgba(76,123,244,.15);color:var(--accent)}
.nav-item svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item .badge{margin-left:auto;font-size:10px;font-weight:700;
  background:var(--accent);color:#fff;border-radius:20px;padding:2px 7px}

.sidebar-bottom{margin-top:auto;padding:0 12px}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:12px 10px;
  border-radius:10px;cursor:pointer}
.sidebar-user:hover{background:var(--surface2)}
.avatar{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.user-name{font-size:13px;font-weight:700}
.user-sub{font-size:11px;color:var(--text3)}

/* ── Main content ────────────────────────────────────────────────── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Topbar ──────────────────────────────────────────────────────── */
#topbar{
  display:flex;align-items:center;gap:16px;padding:16px 28px;
  border-bottom:1px solid var(--border);background:var(--sidebar);flex-shrink:0
}
.topbar-title{font-size:18px;font-weight:800;letter-spacing:-.3px;flex:1}
.topbar-search{position:relative;width:260px}
.topbar-search input{width:100%;padding:8px 14px 8px 38px;border-radius:10px;font-size:13px}
.topbar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar-btn{padding:8px 16px;border-radius:10px;font-size:13px;font-weight:700;
  background:var(--accent);color:#fff;transition:.15s}
.topbar-btn:hover{opacity:.9}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}

/* ── Page ────────────────────────────────────────────────────────── */
#page{flex:1;overflow-y:auto;padding:28px;overflow-x:hidden}
#page::-webkit-scrollbar{width:6px}
#page::-webkit-scrollbar-track{background:transparent}
#page::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Grid helpers ────────────────────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.grid-col-2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}

/* ── Cards ───────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.card-action{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}

/* ── Stat cards ──────────────────────────────────────────────────── */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(76,123,244,.06)}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;margin-bottom:14px}
.stat-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.stat-value{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1}
.stat-sub{font-size:12px;margin-top:6px;font-weight:600}

/* ── Gradient hero ───────────────────────────────────────────────── */
.hero-card{background:linear-gradient(135deg,#1B2FC4 0%,#4C7BF4 45%,#6C3BF4 100%);
  border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;border:none}
.hero-card::before{content:'';position:absolute;top:-40px;right:-40px;
  width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-card::after{content:'';position:absolute;bottom:-50px;left:40px;
  width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04)}
.hero-label{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
  color:rgba(255,255,255,.6);margin-bottom:6px}
.hero-value{font-size:38px;font-weight:800;letter-spacing:-1px;color:#fff;line-height:1;position:relative;z-index:1}
.hero-sub{font-size:13px;color:rgba(255,255,255,.75);margin-top:6px;font-weight:600;position:relative;z-index:1}

/* ── Chart ───────────────────────────────────────────────────────── */
.chart-wrap{height:220px;position:relative;margin-top:8px}
.chart-wrap-lg{height:300px;position:relative}

/* ── Table ───────────────────────────────────────────────────────── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--text3);padding:0 0 10px;text-align:left;white-space:nowrap}
th:not(:first-child){text-align:right}
td{padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
td:not(:first-child){text-align:right}
tr:last-child td{border-bottom:none}
tr{cursor:pointer;transition:.15s}
tr:hover td{background:rgba(255,255,255,.02)}

/* ── Asset row in table ──────────────────────────────────────────── */
.asset-cell{display:flex;align-items:center;gap:10px}
.coin-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:11px;flex-shrink:0;letter-spacing:-.3px}
.asset-name{font-weight:700;font-size:14px}
.asset-sub{font-size:11px;color:var(--text3);margin-top:1px}
.chg-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.up-bg{background:rgba(0,196,140,.15);color:var(--green)}
.dn-bg{background:rgba(255,91,91,.15);color:var(--red)}
.up{color:var(--green)}.dn{color:var(--red)}

/* ── Period tabs ─────────────────────────────────────────────────── */
.period-tabs{display:flex;gap:4px}
.ptab{padding:5px 12px;border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;color:var(--text3);transition:.2s}
.ptab.active{background:var(--accent);color:#fff}

/* ── Strategy pills ──────────────────────────────────────────────── */
.strat-pills{display:flex;gap:6px;flex-wrap:wrap}
.spill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:var(--surface2);color:var(--text3);transition:.2s}
.spill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Signal badge ────────────────────────────────────────────────── */
.signal-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;
  border-radius:30px;font-weight:800;font-size:15px}
.sig-buy{background:rgba(0,196,140,.18);color:var(--green);border:1.5px solid var(--green)}
.sig-sell{background:rgba(255,91,91,.18);color:var(--red);border:1.5px solid var(--red)}
.sig-hold{background:rgba(240,185,11,.12);color:var(--yellow);border:1.5px solid var(--yellow)}

/* ── Indicator grid ──────────────────────────────────────────────── */
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ind-cell{background:var(--surface2);border-radius:10px;padding:14px;border:1px solid var(--border)}
.ind-cell .ilabel{font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.ind-cell .ival{font-size:20px;font-weight:800;line-height:1.1}
.ind-cell .isub{font-size:11px;color:var(--text3);margin-top:3px}

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn{border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;
  cursor:pointer;border:none;transition:.15s}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btn-full{width:100%}

/* ── Forms ───────────────────────────────────────────────────────── */
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.form-row input,.form-row select{width:100%}
.trade-tabs{display:flex;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:16px}
.ttab{flex:1;padding:9px;text-align:center;font-weight:700;font-size:14px;
  border-radius:8px;cursor:pointer;transition:.2s;color:var(--text3)}
.ttab.buy.active{background:var(--green);color:#000}
.ttab.sell.active{background:var(--red);color:#fff}

/* ── Backtest rows ───────────────────────────────────────────────── */
.bt-row{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.bt-row:last-child{border-bottom:none}
.bt-lbl{color:var(--text3)}
.bt-val{font-weight:700}

/* ── Lesson cards ────────────────────────────────────────────────── */
.lesson-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:0;overflow:hidden;display:flex;cursor:pointer;transition:.15s;margin-bottom:10px}
.lesson-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.lesson-stripe{width:5px;flex-shrink:0}
.lesson-inner{padding:16px;flex:1}
.lesson-num{font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.lesson-title{font-weight:700;font-size:14px}
.lesson-arrow{display:flex;align-items:center;padding-right:16px;color:var(--text3)}
.lesson-content-text{font-size:13px;color:var(--text2);line-height:1.75;white-space:pre-wrap}
.quiz-opt{display:block;width:100%;text-align:left;padding:11px 14px;border-radius:10px;
  background:var(--surface2);margin-bottom:7px;font-size:13px;border:1.5px solid var(--border);
  transition:.2s;cursor:pointer;color:var(--text)}
.quiz-opt.correct{border-color:var(--green);color:var(--green);background:rgba(0,196,140,.1)}
.quiz-opt.wrong{border-color:var(--red);color:var(--red);background:rgba(255,91,91,.1)}
.gitem{padding:12px 0;border-bottom:1px solid var(--border)}
.gitem:last-child{border-bottom:none}
.gterm{font-weight:700;color:var(--accent);margin-bottom:2px;font-size:13px}
.gdef{font-size:12px;color:var(--text3);line-height:1.5}

/* ── Toast ───────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--surface3);border:1px solid var(--border);
  padding:11px 22px;border-radius:30px;font-size:13px;font-weight:600;
  opacity:0;transition:.25s;z-index:9999;pointer-events:none;white-space:nowrap;
  box-shadow:0 8px 40px rgba(0,0,0,.5);color:var(--text)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* ── Loader ──────────────────────────────────────────────────────── */
.loader{display:flex;justify-content:center;align-items:center;padding:60px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px;color:var(--text3);font-size:13px}

/* ── Sparkline ───────────────────────────────────────────────────── */
.spark{width:80px;height:36px;display:inline-block}

/* ── Scrollable sub-page ─────────────────────────────────────────── */
.sub-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:7px 12px;border-radius:8px;background:rgba(76,123,244,.1)}
.back-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── Responsive: collapse sidebar on small screens ───────────────── */
@media(max-width:768px){
  :root{--sidebar-w:0px}
  #sidebar{display:none}
  #page{padding:16px}
  .grid-2,.grid-3,.grid-4,.grid-col-2{grid-template-columns:1fr}
  .topbar-search{display:none}
}
</style>
</head>
<body>
<div id="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="logo">
      <div class="logo-icon">CT</div>
      <div>
        <div class="logo-text">Codon Trader</div>
        <div class="logo-sub">Paper Trading</div>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Main</div>
      <div class="nav-item active" onclick="goPage('dashboard')" id="ni-dashboard">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
      <div class="nav-item" onclick="goPage('markets')" id="ni-markets">
        <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Markets
      </div>
      <div class="nav-item" onclick="goPage('analyze')" id="ni-analyze">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Analyze
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Trading</div>
      <div class="nav-item" onclick="goPage('trade')" id="ni-trade">
        <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        Trade
      </div>
      <div class="nav-item" onclick="goPage('portfolio')" id="ni-portfolio">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        Portfolio
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Learn</div>
      <div class="nav-item" onclick="goPage('learn')" id="ni-learn">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        Lessons
      </div>
      <div class="nav-item" onclick="goPage('glossary')" id="ni-glossary">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Glossary
      </div>
    </div>

    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="avatar">CT</div>
        <div>
          <div class="user-name">Codon Trader</div>
          <div class="user-sub">Paper account</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div id="main">
    <header id="topbar">
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="global-search" placeholder="Search symbol…"
          onkeydown="if(event.key==='Enter')globalSearch()"/>
      </div>
      <div class="status-dot" title="Simulated data"></div>
      <span style="font-size:12px;color:var(--text3);font-weight:600">Simulated</span>
    </header>
    <div id="page"></div>
  </div>
</div>
<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let currentPage = 'dashboard';
let analyzeSymbol = 'BTC-USD';
let analyzeStrategy = 'ma_crossover';
let tradeMode = 'buy';
let activeLesson = null;
let priceChart = null;
let _glossaryTerms = [];
let _mktData = [];
let _mktFilter = 'all';

const COINS = [
  {sym:'BTC-USD', name:'Bitcoin',   abbr:'BTC', color:'#F7931A', bg:'rgba(247,147,26,.15)'},
  {sym:'ETH-USD', name:'Ethereum',  abbr:'ETH', color:'#627EEA', bg:'rgba(98,126,234,.15)'},
  {sym:'AAPL',   name:'Apple',     abbr:'AAPL',color:'#A2AAAD', bg:'rgba(162,170,173,.12)'},
  {sym:'MSFT',   name:'Microsoft', abbr:'MSFT',color:'#00A4EF', bg:'rgba(0,164,239,.12)'},
  {sym:'NVDA',   name:'NVIDIA',    abbr:'NVDA',color:'#76B900', bg:'rgba(118,185,0,.12)'},
  {sym:'TSLA',   name:'Tesla',     abbr:'TSLA',color:'#CC0000', bg:'rgba(204,0,0,.12)'},
  {sym:'SPY',    name:'S&P 500 ETF',abbr:'SPY',color:'#4C7BF4', bg:'rgba(76,123,244,.12)'},
  {sym:'GOOGL',  name:'Alphabet',  abbr:'GOOG',color:'#EA4335', bg:'rgba(234,67,53,.12)'},
];
const LESSON_COLORS = ['#4C7BF4','#00C48C','#F0B90B','#FF5B5B','#A855F7'];

// ── Utils ─────────────────────────────────────────────────────────────────────
function toast(msg, type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className=`show ${type}`;
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',2600);
}
const GET=(u)=>fetch(u).then(r=>r.json());
const POST=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());

function fmtPrice(n){
  if(n==null)return'—';
  if(n>=1000)return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(n>=10)return n.toFixed(2); if(n>=1)return n.toFixed(3); return n.toFixed(4);
}
function fmtNum(n){return n==null?'—':n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtK(n){if(n>=1000000)return(n/1000000).toFixed(2)+'M'; if(n>=1000)return(n/1000).toFixed(1)+'K'; return n.toFixed(0);}
function coinMeta(sym){return COINS.find(c=>c.sym===sym)||{abbr:sym.slice(0,4),color:'#4C7BF4',bg:'rgba(76,123,244,.15)',name:sym};}
function coinIcon(sym,size=36){
  const c=coinMeta(sym);
  return `<div class="coin-icon" style="width:${size}px;height:${size}px;background:${c.bg};color:${c.color}">${c.abbr.slice(0,4)}</div>`;
}

// Sparkline (pseudo-random deterministic)
function _seed(s){let h=0;for(const c of s)h=((h<<5)-h)+c.charCodeAt(0);return h>>>0}
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawSpark(id, up){
  const el=document.getElementById('sp-'+id); if(!el)return;
  const rng=mulberry32(_seed(id));
  const pts=Array.from({length:14},(_,i)=>50+(up?1:-1)*(i/13)*18+(rng()-.5)*14);
  new Chart(el,{type:'line',data:{labels:pts.map((_,i)=>i),datasets:[{
    data:pts,borderColor:up?'#00C48C':'#FF5B5B',borderWidth:1.8,
    pointRadius:0,tension:0.4,fill:false}]},
    options:{plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false}},animation:{duration:0},events:[]}});
}

async function submitQuickTrade(){

function drawMainChart(records){
  const canvas=document.getElementById('main-chart'); if(!canvas)return;
  if(priceChart){priceChart.destroy();priceChart=null;}
  const closes=records.map(r=>r.Close);
  const up=closes[closes.length-1]>=closes[0];
  const color=up?'#00C48C':'#FF5B5B';
  priceChart=new Chart(canvas,{type:'line',data:{
    labels:records.map(r=>r.date),
    datasets:[{data:closes,borderColor:color,borderWidth:2.5,pointRadius:0,fill:true,tension:0.3,
      backgroundColor:ctx=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,280);g.addColorStop(0,color+'50');g.addColorStop(1,color+'00');return g;}}]
  },options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,
      backgroundColor:'#1C2040',borderColor:'#252B52',borderWidth:1,
      titleColor:'#A8AECB',bodyColor:'#fff',padding:12,cornerRadius:10,
      callbacks:{label:c=>`$${c.parsed.y.toFixed(2)}`}}},
    scales:{x:{display:false},y:{display:true,position:'right',
      grid:{color:'rgba(37,43,82,.5)'},
      ticks:{color:'#5D638A',font:{size:11},callback:v=>`$${v.toFixed(0)}`}}},
    interaction:{mode:'index',intersect:false}}});
}

async function reloadChart(sym,period,el){
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const chart=await GET(`/api/chart/${sym}?period=${period}`);
  drawMainChart(chart);
}

// ── TRADE ─────────────────────────────────────────────────────────────────────
function renderTrade(p){
  p.innerHTML=`
    <div class="grid-2" style="align-items:start">
      <!-- Order form -->
      <div class="card">
        <div class="card-header"><div class="card-title">Place Order</div></div>
        <div class="trade-tabs">
          <div class="ttab buy${tradeMode==='buy'?' active':''}" id="tt-buy" onclick="setTradeMode('buy')">Buy</div>
          <div class="ttab sell${tradeMode==='sell'?' active':''}" id="tt-sell" onclick="setTradeMode('sell')">Sell</div>
        </div>
        <div class="form-row">
          <label>Symbol</label>
          <input id="trade-sym" value="${analyzeSymbol}" placeholder="BTC-USD"
            oninput="this.value=this.value.toUpperCase()" onblur="fetchTradeSym()"/>
        </div>
        <div id="trade-quote-row" style="margin-bottom:14px"></div>
        <div class="form-row"><label>Number of Shares</label><input id="trade-shares" type="number" min="1" placeholder="0" oninput="updateTradeEst()"/></div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:16px">
          <span style="font-size:13px;color:var(--text3)">Estimated total</span>
          <span style="font-size:20px;font-weight:800" id="trade-est">$0.00</span>
        </div>
        <button class="btn ${tradeMode==='buy'?'btn-green':'btn-red'} btn-full" id="trade-btn" onclick="submitTrade()">${tradeMode==='buy'?'Buy Now':'Sell Now'}</button>
      </div>

      <!-- Position sizer -->
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-header"><div class="card-title">Position Size Calculator</div></div>
          <div class="grid-2" style="margin-bottom:14px">
            <div class="form-row" style="margin:0"><label>Entry Price $</label><input id="sz-e" type="number" placeholder="195.00"/></div>
            <div class="form-row" style="margin:0"><label>Stop-Loss $</label><input id="sz-s" type="number" placeholder="190.00"/></div>
            <div class="form-row" style="margin:0"><label>Account Size $</label><input id="sz-a" type="number" placeholder="10000"/></div>
            <div class="form-row" style="margin:0"><label>Risk %</label><input id="sz-r" type="number" placeholder="1" value="1"/></div>
          </div>
          <button class="btn btn-primary btn-full" onclick="calcSize()">Calculate</button>
          <div id="sz-result" style="margin-top:14px"></div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title">Strategy Signal</div>
          </div>
          <div class="strat-pills" style="margin-bottom:14px" id="trade-strats">
            ${['ma_crossover','rsi','bollinger','macd'].map(n=>`<div class="spill${n===analyzeStrategy?' active':''}" onclick="selectTradestrat('${n}',this)">${{ma_crossover:'MA Cross',rsi:'RSI',bollinger:'Bollinger',macd:'MACD'}[n]}</div>`).join('')}
          </div>
          <div id="trade-sig-zone"><div class="loader" style="padding:20px"><div class="spinner"></div></div></div>
        </div>
      </div>
    </div>`;
  fetchTradeSym();
  loadTradeSig();
}

let _tradePrice=0;
async function fetchTradeSym(){
  const sym=document.getElementById('trade-sym')?.value.trim(); if(!sym)return;
  const q=await GET(`/api/quote/${sym}`);
  _tradePrice=q.price||0;
  const r=document.getElementById('trade-quote-row'); if(!r)return;
  if(q.error){r.innerHTML=`<span style="color:var(--red);font-size:13px">${q.error}</span>`;return;}
  const up=q.change>=0;
  r.innerHTML=`<div style="display:flex;align-items:center;gap:16px;background:var(--surface2);border-radius:10px;padding:12px 14px">
    ${coinIcon(sym,32)}
    <div style="flex:1"><div style="font-weight:700">${coinMeta(sym).name}</div></div>
    <div style="text-align:right">
      <div style="font-size:18px;font-weight:800">$${fmtPrice(q.price)}</div>
      <div style="font-size:12px;color:${up?'var(--green)':'var(--red)'};font-weight:600">${up?'+':''}${q.change_pct}% today</div>
    </div>
  </div>`;
  updateTradeEst();
}
function updateTradeEst(){
  const s=parseFloat(document.getElementById('trade-shares')?.value)||0;
  const el=document.getElementById('trade-est'); if(el)el.textContent=`$${fmtNum(s*_tradePrice)}`;
}
async function submitTrade(){
  const sym=document.getElementById('trade-sym')?.value.trim().toUpperCase();
  const shares=parseInt(document.getElementById('trade-shares')?.value);
  if(!sym||!shares||shares<1){toast('Enter symbol and shares','err');return;}
  const r=await POST(tradeMode==='buy'?'/api/trade/buy':'/api/trade/sell',{symbol:sym,shares});
  if(r.error){toast(r.error,'err');return;}
  const t=r.trade;
  toast(tradeMode==='buy'?`Bought ${t.shares} × ${t.symbol} @ $${fmtPrice(t.price)}`:`Sold  ${t.shares} × ${t.symbol}  P&L: ${t.pnl>=0?'+':''}$${t.pnl?.toFixed(2)}`,'ok');
  document.getElementById('trade-shares').value='';
  updateTradeEst();
}
function selectTradestrat(name,el){
  analyzeStrategy=name;
  document.querySelectorAll('#trade-strats .spill').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  loadTradeSig();
}
async function loadTradeSig(){
  const sym=document.getElementById('trade-sym')?.value.trim()||analyzeSymbol;
  const z=document.getElementById('trade-sig-zone'); if(!z)return;
  const sig=await GET(`/api/signal/${sym}?strategy=${analyzeStrategy}&period=1y`);
  if(!document.getElementById('trade-sig-zone'))return;
  const type=sig.signal?.startsWith('BUY')?'buy':sig.signal?.startsWith('SELL')?'sell':'hold';
  z.innerHTML=`<div style="text-align:center;padding:8px 0 4px">
    <div class="signal-badge sig-${type}">${type==='buy'?'▲ BUY':type==='sell'?'▼ SELL':'● HOLD'}</div>
    <div style="font-size:12px;color:var(--text3);margin-top:10px">${sig.signal||'HOLD'}</div>
  </div>`;
}
async function calcSize(){
  const e=parseFloat(document.getElementById('sz-e')?.value);
  const s=parseFloat(document.getElementById('sz-s')?.value);
  const a=parseFloat(document.getElementById('sz-a')?.value)||10000;
  const r=parseFloat(document.getElementById('sz-r')?.value)||1;
  if(!e||!s){toast('Enter entry and stop prices','err');return;}
  const res=await POST('/api/size',{entry:e,stop:s,account:a,risk_pct:r});
  if(res.error){toast(res.error,'err');return;}
  document.getElementById('sz-result').innerHTML=`
    <div style="border-top:1px solid var(--border);padding-top:12px">
      ${[['Recommended shares',res.recommended_shares],['Position cost',`$${fmtNum(res.position_cost)}`],
         ['Max loss (at SL)',`$${res.potential_loss}`],['1:2 target price',`$${res.reward_target_1r2r?.toFixed(2)}`]]
        .map(([l,v])=>`<div class="bt-row"><span class="bt-lbl">${l}</span><span class="bt-val">${v}</span></div>`).join('')}
    </div>`;
}

// ── PORTFOLIO ─────────────────────────────────────────────────────────────────
async function renderPortfolio(p){
  p.innerHTML=`<div class="loader"><div class="spinner"></div></div>`;
  const port=await GET('/api/portfolio');
  const initCap=10000;
  const totalPct=((port.total_value-initCap)/initCap*100);
  const tColor=totalPct>=0?'var(--green)':'var(--red)';

  p.innerHTML=`
    <div class="grid-4" style="margin-bottom:20px">
      <div class="hero-card"><div class="hero-label">Total Value</div><div class="hero-value">$${fmtNum(port.total_value||0)}</div><div class="hero-sub">${totalPct>=0?'+':''}${totalPct.toFixed(2)}% vs $10k start</div></div>
      <div class="stat-card"><div class="stat-label">Cash</div><div class="stat-value">$${fmtNum(port.cash||0)}</div><div class="stat-sub" style="color:var(--text3)">Available</div></div>
      <div class="stat-card"><div class="stat-label">Invested</div><div class="stat-value">$${fmtNum(port.positions_value||0)}</div><div class="stat-sub" style="color:var(--text3)">${port.positions?.length||0} positions</div></div>
      <div class="stat-card"><div class="stat-label">Realized P&L</div><div class="stat-value" style="color:${(port.realized_pnl||0)>=0?'var(--green)':'var(--red)'}">${(port.realized_pnl||0)>=0?'+':''}$${Math.abs(port.realized_pnl||0).toFixed(2)}</div><div class="stat-sub" style="color:var(--text3)">${port.num_trades||0} trades</div></div>
    </div>

    <div class="grid-2" style="align-items:start">
      <div class="card">
        <div class="card-header"><div class="card-title">Open Positions</div></div>
        ${port.positions?.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Asset</th><th>Shares</th><th>Avg Price</th><th>Current</th><th>Value</th><th>Unrealized P&L</th></tr></thead>
          <tbody>${port.positions.map(pos=>{
            const c=pos.unrealized_pnl>=0?'var(--green)':'var(--red)';
            return `<tr onclick="analyzeSymbol='${pos.symbol}';goPage('analyze')">
              <td><div class="asset-cell">${coinIcon(pos.symbol,32)}<div><div class="asset-name">${pos.symbol}</div><div class="asset-sub">${coinMeta(pos.symbol).name}</div></div></div></td>
              <td>${pos.shares}</td>
              <td>$${pos.avg_price?.toFixed(4)}</td>
              <td>$${pos.current_price?.toFixed(4)}</td>
              <td style="font-weight:700">$${fmtNum(pos.market_value)}</td>
              <td style="color:${c};font-weight:700">${pos.unrealized_pnl>=0?'+':''}$${pos.unrealized_pnl?.toFixed(2)} <span style="font-size:11px">(${pos.unrealized_pct>=0?'+':''}${pos.unrealized_pct?.toFixed(1)}%)</span></td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>` : '<div class="empty">No open positions</div>'}
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Trade History</div></div>
        ${port.history?.length ? `<div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Action</th><th>Asset</th><th>Shares</th><th>Price</th><th>P&L</th></tr></thead>
          <tbody>${port.history.slice().reverse().slice(0,15).map(t=>{
            const buy=t.action==='BUY';
            return `<tr>
              <td style="color:var(--text3);font-size:12px">${t.date?.slice(0,10)}</td>
              <td><span class="chg-badge ${buy?'up-bg':'dn-bg'}">${t.action}</span></td>
              <td><div class="asset-cell">${coinIcon(t.symbol,26)}<span style="font-weight:700;font-size:13px">${t.symbol}</span></div></td>
              <td>${t.shares}</td>
              <td>$${fmtPrice(t.price)}</td>
              <td style="font-weight:700;color:${t.pnl!=null?(t.pnl>=0?'var(--green)':'var(--red)'):'var(--text3)'}">${t.pnl!=null?(t.pnl>=0?'+':'')+'$'+t.pnl?.toFixed(2):'—'}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>` : '<div class="empty">No trades yet</div>'}
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
          <button class="btn btn-ghost" onclick="confirmReset()">Reset to $10,000</button>
        </div>
      </div>
    </div>`;
}
function confirmReset(){
  if(!confirm('Reset portfolio to $10,000? Clears all positions and history.'))return;
  POST('/api/portfolio/reset',{capital:10000}).then(()=>{toast('Portfolio reset','ok');renderPortfolio(document.getElementById('page'));});
}

// ── LEARN ─────────────────────────────────────────────────────────────────────
async function renderLearn(p){
  if(activeLesson){renderLessonDetail(p);return;}
  p.innerHTML=`<div class="grid-2" style="align-items:start"><div id="lesson-list"><div class="loader"><div class="spinner"></div></div></div>
    <div class="card"><div class="card-header"><div class="card-title">About the Lessons</div></div>
      <div style="color:var(--text2);font-size:13px;line-height:1.75">
        <p>Five interactive lessons covering everything you need to start trading confidently.</p><br/>
        <p><strong style="color:var(--text)">What you'll learn:</strong></p>
        <ul style="margin-left:18px;margin-top:8px;display:flex;flex-direction:column;gap:8px">
          <li>What trading is and how markets work</li>
          <li>How to read candlestick charts</li>
          <li>Technical indicators (RSI, MACD, Bollinger)</li>
          <li>Risk management and the 1% rule</li>
          <li>Trading strategies and when to use them</li>
        </ul><br/>
        <p>Each lesson ends with a quiz to test your understanding.</p>
      </div>
    </div></div>`;
  const lessons=await GET('/api/learn/lessons');
  const ll=document.getElementById('lesson-list'); if(!ll)return;
  ll.innerHTML=lessons.map((l,i)=>`
    <div class="lesson-card" onclick="openLesson(${l.id})">
      <div class="lesson-stripe" style="background:${LESSON_COLORS[i%LESSON_COLORS.length]}"></div>
      <div class="lesson-inner">
        <div class="lesson-num">Lesson ${l.id}</div>
        <div class="lesson-title">${l.title}</div>
      </div>
      <div class="lesson-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>`).join('');
}

async function openLesson(id){
  const p=document.getElementById('page');
  p.innerHTML=`<div class="loader"><div class="spinner"></div></div>`;
  activeLesson=await GET(`/api/learn/lesson/${id}`);
  renderLessonDetail(p);
}
function renderLessonDetail(p){
  const l=activeLesson;
  p.innerHTML=`
    <div class="sub-header">
      <button class="back-btn" onclick="activeLesson=null;renderLearn(document.getElementById('page'))">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Lessons
      </button>
      <div>
        <div style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.5px;text-transform:uppercase">Lesson ${l.id}</div>
        <div style="font-size:20px;font-weight:800">${l.title}</div>
      </div>
    </div>
    <div class="grid-2" style="align-items:start">
      <div class="card"><div class="card-title" style="margin-bottom:16px">Content</div><div class="lesson-content-text">${l.content}</div></div>
      <div class="card">
        <div class="card-title" style="margin-bottom:16px">Quiz</div>
        ${l.quiz.map((q,qi)=>`
          <div style="margin-bottom:20px">
            <div style="font-weight:700;margin-bottom:12px;font-size:14px;line-height:1.5">${q.q}</div>
            ${q.options.map(opt=>`<button class="quiz-opt" onclick="answerQuiz(this,'${opt[0]}','${q.answer}',${qi})">${opt}</button>`).join('')}
            <div id="qfb-${qi}" style="font-size:12px;margin-top:4px;min-height:16px"></div>
          </div>`).join('')}
      </div>
    </div>`;
}
function answerQuiz(btn,chosen,correct,qi){
  btn.parentElement.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  if(chosen===correct){btn.classList.add('correct');document.getElementById(`qfb-${qi}`).innerHTML=`<span style="color:var(--green)">✓ Correct!</span>`;toast('Correct!','ok');}
  else{btn.classList.add('wrong');btn.parentElement.querySelectorAll('.quiz-opt').forEach(b=>{if(b.textContent.trim().startsWith(correct))b.classList.add('correct');});document.getElementById(`qfb-${qi}`).innerHTML=`<span style="color:var(--red)">Answer: ${correct}</span>`;toast('Not quite','err');}
}

// ── GLOSSARY ──────────────────────────────────────────────────────────────────
async function renderGlossary(p){
  p.innerHTML=`
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div style="position:relative;flex:1;max-width:360px">
        <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input style="padding-left:38px;width:100%" id="g-search" placeholder="Search 30 terms…" oninput="filterGlossary()"/>
      </div>
    </div>
    <div class="card" id="g-wrap"><div class="loader"><div class="spinner"></div></div></div>`;
  _glossaryTerms=await GET('/api/learn/glossary');
  renderGlossaryList(_glossaryTerms);
}
function filterGlossary(){
  const q=(document.getElementById('g-search')?.value||'').toLowerCase();
  renderGlossaryList(_glossaryTerms.filter(t=>t.term.toLowerCase().includes(q)||t.definition.toLowerCase().includes(q)));
}
function renderGlossaryList(terms){
  const el=document.getElementById('g-wrap'); if(!el)return;
  el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0">
    ${terms.map(t=>`<div class="gitem"><div class="gterm">${t.term}</div><div class="gdef">${t.definition}</div></div>`).join('')}
  </div>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
goPage('dashboard');
</script>
