<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0B0D1E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/manifest.json"/>
<title>Codon Trader</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ── Reset ───────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  /* Figma kit exact tokens */
  --bg:       #0B0D1E;
  --surface:  #141729;
  --surface2: #1C2040;
  --surface3: #232849;
  --border:   #252B52;
  --accent:   #4C7BF4;   /* primary blue */
  --accent2:  #6C3BF4;   /* violet */
  --green:    #00C48C;
  --red:      #FF5B5B;
  --yellow:   #F0B90B;
  --text:     #FFFFFF;
  --text2:    #A8AECB;
  --text3:    #5D638A;
  --radius:   16px;
  --radius-sm:10px;
  --nav-h:    68px;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',Inter,Roboto,sans-serif;
  font-size:15px;overflow:hidden}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,select{font:inherit;color:var(--text);background:var(--surface2);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 16px;width:100%;outline:none;transition:.2s}
input:focus{border-color:var(--accent);background:var(--surface3)}
input::placeholder{color:var(--text3)}

/* ── App shell ───────────────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;
  padding-bottom:calc(var(--nav-h)+env(safe-area-inset-bottom))}
#screen::-webkit-scrollbar{display:none}

/* ── Bottom Nav ──────────────────────────────────────────────────── */
#nav{
  display:flex;position:fixed;bottom:0;left:0;right:0;
  height:calc(var(--nav-h)+env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--border);
  z-index:100;backdrop-filter:blur(20px);
}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;color:var(--text3);
  font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  transition:.2s;position:relative}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.nav-dot{position:absolute;top:8px;width:4px;height:4px;border-radius:50%;
  background:var(--accent);opacity:0;transition:.2s}
.nav-btn.active .nav-dot{opacity:1}

/* ── Safe area header ────────────────────────────────────────────── */
.safe-top{height:calc(16px + env(safe-area-inset-top))}

/* ── Typography ──────────────────────────────────────────────────── */
.t-display{font-size:36px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.t-display-sm{font-size:28px;font-weight:800;letter-spacing:-.3px}
.t-title{font-size:20px;font-weight:700}
.t-label{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text2)}
.t-body{font-size:14px;line-height:1.6;color:var(--text2)}
.t-mono{font-variant-numeric:tabular-nums}

/* ── Section header ──────────────────────────────────────────────── */
.section-header{display:flex;align-items:center;justify-content:space-between;
  padding:20px 20px 12px}
.section-header h2{font-size:17px;font-weight:700}
.section-header a{font-size:13px;color:var(--accent);font-weight:600}

/* ── Gradient balance card ───────────────────────────────────────── */
.balance-card{
  margin:0 16px 20px;border-radius:24px;padding:24px;
  background:linear-gradient(135deg,#2B3FC4 0%,#4C7BF4 40%,#6C3BF4 100%);
  position:relative;overflow:hidden;
}
.balance-card::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.balance-card::after{
  content:'';position:absolute;bottom:-60px;left:20px;
  width:200px;height:200px;border-radius:50%;
  background:rgba(255,255,255,.05);
}
.balance-label{font-size:12px;font-weight:600;letter-spacing:.6px;
  text-transform:uppercase;color:rgba(255,255,255,.65);margin-bottom:6px}
.balance-amount{font-size:38px;font-weight:800;letter-spacing:-1px;color:#fff;
  line-height:1;margin-bottom:4px}
.balance-change{font-size:13px;font-weight:600;color:rgba(255,255,255,.8)}
.balance-actions{display:flex;gap:10px;margin-top:20px;position:relative;z-index:1}
.bal-action{flex:1;background:rgba(255,255,255,.18);border-radius:12px;
  padding:11px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
  backdrop-filter:blur(10px);cursor:pointer;transition:.15s}
.bal-action:active{background:rgba(255,255,255,.28)}
.bal-action svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.bal-action span{font-size:11px;font-weight:700;color:#fff;letter-spacing:.3px}

/* ── Quick stats row ─────────────────────────────────────────────── */
.stats-row{display:flex;gap:10px;padding:0 16px;margin-bottom:20px}
.stat-pill{flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:12px;text-align:center}
.stat-pill .val{font-size:16px;font-weight:800;margin-bottom:2px}
.stat-pill .lbl{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.5px;text-transform:uppercase}

/* ── Asset list ──────────────────────────────────────────────────── */
.asset-item{display:flex;align-items:center;padding:14px 20px;
  gap:12px;cursor:pointer;transition:.15s}
.asset-item:active{background:var(--surface2)}
.coin-icon{width:44px;height:44px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:14px;
  flex-shrink:0;letter-spacing:-.5px}
.asset-info{flex:1;min-width:0}
.asset-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-sub{font-size:12px;color:var(--text3);margin-top:1px}
.asset-price{text-align:right;flex-shrink:0}
.asset-val{font-weight:700;font-size:15px}
.asset-chg{font-size:12px;font-weight:600;margin-top:2px;padding:2px 7px;
  border-radius:20px;display:inline-block}
.up-bg{background:rgba(0,196,140,.15);color:var(--green)}
.dn-bg{background:rgba(255,91,91,.15);color:var(--red)}
.up{color:var(--green)}.dn{color:var(--red)}

/* ── Sparkline mini chart ────────────────────────────────────────── */
.spark{width:64px;height:32px;flex-shrink:0}

/* ── Search bar ──────────────────────────────────────────────────── */
.search-box{margin:0 16px 16px;position:relative}
.search-box input{padding-left:44px;border-radius:14px}
.search-box .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;stroke:var(--text3);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* ── Filter tabs ─────────────────────────────────────────────────── */
.filter-tabs{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto;scrollbar-width:none}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;
  white-space:nowrap;cursor:pointer;transition:.2s;
  background:var(--surface);border:1px solid var(--border);color:var(--text3)}
.ftab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Divider ─────────────────────────────────────────────────────── */
.divider{height:1px;background:var(--border);margin:0 20px}

/* ── Cards ───────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;margin:0 16px 12px}
.card-dark{background:var(--surface2);border:1px solid var(--border)}

/* ── Buttons ─────────────────────────────────────────────────────── */
.btn{border-radius:14px;padding:15px;font-size:16px;font-weight:700;
  width:100%;transition:.15s;cursor:pointer;border:none;letter-spacing:.2px}
.btn:active{transform:scale(.97);opacity:.9}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-green{background:var(--green);color:#000}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btn-sm{padding:10px 18px;font-size:13px;width:auto;border-radius:10px}

/* ── Trade tabs ──────────────────────────────────────────────────── */
.trade-tabs{display:flex;background:var(--surface2);
  border-radius:14px;padding:4px;margin:0 16px 20px}
.ttab{flex:1;padding:11px;text-align:center;font-weight:700;font-size:14px;
  border-radius:11px;cursor:pointer;transition:.2s;color:var(--text3)}
.ttab.buy.active{background:var(--green);color:#000}
.ttab.sell.active{background:var(--red);color:#fff}

/* ── Amount input ────────────────────────────────────────────────── */
.amount-wrap{background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 20px;margin:0 16px 12px}
.amount-label{font-size:11px;color:var(--text3);font-weight:600;
  letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.amount-row{display:flex;align-items:center;gap:12px}
.amount-input{background:none;border:none;font-size:28px;font-weight:800;
  color:var(--text);flex:1;padding:0;outline:none;width:100%}
.amount-ticker{font-size:16px;font-weight:700;color:var(--text2);
  background:var(--surface3);border-radius:8px;padding:6px 10px;white-space:nowrap}

/* ── Position sizer ──────────────────────────────────────────────── */
.sizer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 12px}
.sizer-field{background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px}
.sizer-field label{display:block;font-size:10px;color:var(--text3);
  font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:6px}
.sizer-field input{background:none;border:none;font-size:16px;font-weight:700;
  padding:0;outline:none;color:var(--text);width:100%}

/* ── Portfolio hero ──────────────────────────────────────────────── */
.port-hero{text-align:center;padding:24px 20px 20px}
.port-hero .lbl{font-size:12px;color:var(--text3);font-weight:600;
  letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.port-hero .val{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.port-hero .sub{font-size:15px;margin-top:8px;font-weight:600}

/* ── Holdings ────────────────────────────────────────────────────── */
.holding{display:flex;align-items:center;gap:12px;padding:14px 20px;
  border-bottom:1px solid var(--border)}
.holding:last-child{border-bottom:none}
.hold-info{flex:1}
.hold-name{font-weight:700;font-size:15px}
.hold-shares{font-size:12px;color:var(--text3);margin-top:2px}
.hold-right{text-align:right}
.hold-val{font-weight:700;font-size:15px}
.hold-pnl{font-size:12px;font-weight:600;margin-top:2px}

/* ── Learn ───────────────────────────────────────────────────────── */
.lesson-card{background:var(--surface);border:1px solid var(--border);
  border-radius:20px;margin:0 16px 12px;padding:0;overflow:hidden;
  display:flex;cursor:pointer;transition:.15s}
.lesson-card:active{opacity:.8}
.lesson-stripe{width:6px;flex-shrink:0}
.lesson-body{padding:16px;flex:1}
.lesson-num{font-size:11px;font-weight:700;color:var(--accent);
  letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.lesson-title{font-weight:700;font-size:15px;margin-bottom:4px}
.lesson-desc{font-size:12px;color:var(--text3);line-height:1.4}
.lesson-arrow{display:flex;align-items:center;padding-right:16px;color:var(--text3)}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 16px;
  border-radius:12px;background:var(--surface2);margin-bottom:8px;font-size:14px;
  border:1.5px solid var(--border);transition:.2s;cursor:pointer;color:var(--text)}
.quiz-opt.correct{border-color:var(--green);color:var(--green);background:rgba(0,196,140,.1)}
.quiz-opt.wrong{border-color:var(--red);color:var(--red);background:rgba(255,91,91,.1)}
.quiz-opt:disabled{cursor:default}
.gitem{padding:14px 20px;border-bottom:1px solid var(--border)}
.gitem:last-child{border-bottom:none}
.gterm{font-weight:700;color:var(--accent);margin-bottom:3px;font-size:14px}
.gdef{font-size:13px;color:var(--text3);line-height:1.5}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--accent);
  font-weight:600;font-size:15px;padding:16px 20px 0;cursor:pointer}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── Chart area ──────────────────────────────────────────────────── */
.chart-card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin:0 16px 12px;padding:16px 10px 12px}
.chart-wrap{height:190px;position:relative}
.period-row{display:flex;gap:6px;justify-content:center;margin-top:10px}
.period-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;
  cursor:pointer;transition:.2s;color:var(--text3);background:transparent;border:none}
.period-btn.active{background:var(--accent);color:#fff;border-radius:20px}

/* ── Badge ───────────────────────────────────────────────────────── */
.signal-wrap{display:flex;justify-content:center;margin:0 16px 12px}
.signal-badge{display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;border-radius:40px;font-weight:800;font-size:16px}
.sig-buy{background:rgba(0,196,140,.18);color:var(--green);border:1.5px solid var(--green)}
.sig-sell{background:rgba(255,91,91,.18);color:var(--red);border:1.5px solid var(--red)}
.sig-hold{background:rgba(240,185,11,.12);color:var(--yellow);border:1.5px solid var(--yellow)}

/* ── Indicator grid ──────────────────────────────────────────────── */
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ind-cell{background:var(--surface2);border-radius:12px;padding:14px;
  border:1px solid var(--border)}
.ind-cell .ilabel{font-size:10px;color:var(--text3);font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px}
.ind-cell .ival{font-size:20px;font-weight:800;line-height:1.1}
.ind-cell .isub{font-size:11px;color:var(--text3);margin-top:3px;font-weight:500}

/* ── Backtest table ──────────────────────────────────────────────── */
.bt-row{display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:14px}
.bt-row:last-child{border-bottom:none}
.bt-lbl{color:var(--text3)}
.bt-val{font-weight:700}

/* ── Strategy pills ──────────────────────────────────────────────── */
.strat-pills{display:flex;gap:8px;padding:0 16px 16px;
  overflow-x:auto;scrollbar-width:none}
.strat-pills::-webkit-scrollbar{display:none}
.spill{padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;
  letter-spacing:.3px;white-space:nowrap;cursor:pointer;transition:.2s;
  background:var(--surface);border:1px solid var(--border);color:var(--text3)}
.spill.active{background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent}

/* ── Toast ───────────────────────────────────────────────────────── */
#toast{position:fixed;bottom:calc(var(--nav-h)+env(safe-area-inset-bottom)+14px);
  left:50%;transform:translateX(-50%) translateY(16px);
  background:var(--surface3);border:1px solid var(--border);
  padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;
  opacity:0;transition:.25s;z-index:999;pointer-events:none;
  white-space:nowrap;box-shadow:0 8px 40px rgba(0,0,0,.5);color:var(--text)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--red);color:var(--red)}

/* ── Loader ──────────────────────────────────────────────────────── */
.loader{display:flex;justify-content:center;padding:48px}
.spinner{width:30px;height:30px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Empty ───────────────────────────────────────────────────────── */
.empty{text-align:center;padding:48px 24px;color:var(--text3)}
.empty svg{width:48px;height:48px;stroke:var(--text3);fill:none;
  stroke-width:1.2;margin-bottom:16px;stroke-linecap:round;stroke-linejoin:round}
.empty h3{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}
.empty p{font-size:13px;line-height:1.5}

/* ── Lesson detail ───────────────────────────────────────────────── */
.lesson-content{padding:0 20px;line-height:1.75;white-space:pre-wrap;
  font-size:14px;color:var(--text2)}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav id="nav">
    <button class="nav-btn active" onclick="goTab('home')" id="nb-home">
      <div class="nav-dot"></div>
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="nav-btn" onclick="goTab('market')" id="nb-market">
      <div class="nav-dot"></div>
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Market
    </button>
    <button class="nav-btn" onclick="goTab('trade')" id="nb-trade">
      <div class="nav-dot"></div>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      Trade
    </button>
    <button class="nav-btn" onclick="goTab('portfolio')" id="nb-portfolio">
      <div class="nav-dot"></div>
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      Portfolio
    </button>
    <button class="nav-btn" onclick="goTab('learn')" id="nb-learn">
      <div class="nav-dot"></div>
      <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      Learn
    </button>
  </nav>
</div>
<div id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let tab = 'home';
let analyzeSymbol = 'BTC-USD';
let analyzeStrategy = 'ma_crossover';
let tradeMode = 'buy';
let learnView = 'list';  // 'list' | 'lesson' | 'glossary'
let activeLesson = null;
let priceChart = null;
let _glossaryTerms = [];

const COINS = [
  {sym:'BTC-USD', name:'Bitcoin',  abbr:'BTC', color:'#F7931A', bg:'rgba(247,147,26,.15)'},
  {sym:'ETH-USD', name:'Ethereum', abbr:'ETH', color:'#627EEA', bg:'rgba(98,126,234,.15)'},
  {sym:'AAPL',   name:'Apple',    abbr:'AAPL',color:'#A2AAAD', bg:'rgba(162,170,173,.12)'},
  {sym:'MSFT',   name:'Microsoft',abbr:'MSFT',color:'#00A4EF', bg:'rgba(0,164,239,.12)'},
  {sym:'NVDA',   name:'NVIDIA',   abbr:'NVDA',color:'#76B900', bg:'rgba(118,185,0,.12)'},
  {sym:'SPY',    name:'S&P 500',  abbr:'SPY', color:'#4C7BF4', bg:'rgba(76,123,244,.12)'},
];

// ─── Toast ────────────────────────────────────────────────────────────────────
function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `show ${type}`;
  clearTimeout(t._t); t._t = setTimeout(()=>t.className='', 2600);
}

// ─── API ──────────────────────────────────────────────────────────────────────
const GET  = u => fetch(u).then(r=>r.json());
const POST = (u,b) => fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());

// ─── Nav ──────────────────────────────────────────────────────────────────────
function goTab(name) {
  tab = name; learnView = 'list';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nb-'+name)?.classList.add('active');
  render();
}
function render() {
  const s = document.getElementById('screen');
  s.scrollTop = 0;
  if (priceChart) { priceChart.destroy(); priceChart = null; }
  ({ home:renderHome, market:renderMarket, trade:renderTrade,
     portfolio:renderPortfolio, learn:renderLearn }[tab])(s);
}

// ─── Coin icon ────────────────────────────────────────────────────────────────
function coinIcon(sym, size=44) {
  const c = COINS.find(c=>c.sym===sym) || {abbr:sym.slice(0,3), color:'#4C7BF4', bg:'rgba(76,123,244,.15)'};
  return `<div class="coin-icon" style="width:${size}px;height:${size}px;background:${c.bg};color:${c.color}">${c.abbr.slice(0,3)}</div>`;
}

// ─── Sparkline ────────────────────────────────────────────────────────────────
function sparkCanvas(id) {
  return `<canvas class="spark" id="sp-${id}"></canvas>`;
}
function drawSpark(id, up) {
  const el = document.getElementById('sp-'+id);
  if (!el) return;
  const pts = Array.from({length:12},(_,i)=>{
    const rng = mulberry32(_seed(id)+i);
    return 50 + (up?1:-1)*(i/11)*20 + (rng()-0.5)*15;
  });
  new Chart(el,{type:'line',data:{labels:pts.map((_,i)=>i),datasets:[{
    data:pts,borderColor:up?'#00C48C':'#FF5B5B',borderWidth:2,
    pointRadius:0,tension:0.4,fill:false}]},
    options:{plugins:{legend:{display:false},tooltip:{enabled:false}},
      scales:{x:{display:false},y:{display:false}},
      animation:{duration:0},events:[]}});
}
function _seed(s){let h=0;for(const c of s)h=((h<<5)-h)+c.charCodeAt(0);return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function drawDetailChart(records, sym) {
  const canvas = document.getElementById('detail-chart');
  if (!canvas) return;
  if (priceChart) { priceChart.destroy(); priceChart = null; }
  const closes = records.map(r=>r.Close);
  const up = closes[closes.length-1] >= closes[0];
  const color = up ? '#00C48C' : '#FF5B5B';
  priceChart = new Chart(canvas, {
    type:'line',
    data:{
      labels: records.map(r=>r.date),
      datasets:[{
        data:closes, borderColor:color, borderWidth:2.5,
        pointRadius:0, fill:true, tension:0.3,
        backgroundColor: ctx=>{
          const g = ctx.chart.ctx.createLinearGradient(0,0,0,180);
          g.addColorStop(0,color+'50'); g.addColorStop(1,color+'00');
          return g;
        }
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{
        mode:'index',intersect:false,
        backgroundColor:'#1C2040', borderColor:'#252B52', borderWidth:1,
        titleColor:'#A8AECB', bodyColor:'#fff', padding:10, cornerRadius:10,
        callbacks:{label:c=>`$${c.parsed.y.toFixed(2)}`}
      }},
      scales:{
        x:{display:false},
        y:{display:true, position:'right',
          grid:{color:'rgba(37,43,82,.6)'},
          ticks:{color:'#5D638A',font:{size:10},callback:v=>`$${v.toFixed(0)}`}
        }
      },
      interaction:{mode:'index',intersect:false}
    }
  });
}

async function submitTrade() {
  const sym = document.getElementById('trade-sym')?.value.trim().toUpperCase();
  const shares = parseInt(document.getElementById('trade-shares')?.value);
  if (!sym) { toast('Enter a symbol','err'); return; }
  if (!shares||shares<1) { toast('Enter number of shares','err'); return; }
  const r = await POST(tradeMode==='buy'?'/api/trade/buy':'/api/trade/sell', {symbol:sym,shares});
  if (r.error) { toast(r.error,'err'); return; }
  const t = r.trade;
  toast(tradeMode==='buy'
    ? `Bought ${t.shares} × ${t.symbol} @ $${fmtPrice(t.price)}`
    : `Sold ${t.shares} × ${t.symbol}  P&L: ${t.pnl>=0?'+':''}$${t.pnl?.toFixed(2)}`,'ok');
  document.getElementById('trade-shares').value='';
  updateTradeTotal();

  const sig = await GET(`/api/signal/${sym}?strategy=${analyzeStrategy}&period=1y`);
  if (!document.getElementById('sig-zone')) return;
  const type = sig.signal?.startsWith('BUY')?'buy':sig.signal?.startsWith('SELL')?'sell':'hold';
  document.getElementById('sig-zone').innerHTML = `
    <div class="signal-wrap">
      <div class="signal-badge sig-${type}">
        ${type==='buy'?'▲ BUY':type==='sell'?'▼ SELL':'● HOLD'}
      </div>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text3);margin-bottom:16px">${sig.signal||'HOLD'}</div>`;
}

async function calcSize() {
  const e=parseFloat(document.getElementById('sz-e')?.value);
  const s=parseFloat(document.getElementById('sz-s')?.value);
  const a=parseFloat(document.getElementById('sz-a')?.value)||10000;
  const r=parseFloat(document.getElementById('sz-r')?.value)||1;
  if(!e||!s){toast('Enter entry and stop prices','err');return;}
  const res = await POST('/api/size',{entry:e,stop:s,account:a,risk_pct:r});
  if(res.error){toast(res.error,'err');return;}
  document.getElementById('sz-result').innerHTML = `
    <div class="card">
      ${[['Recommended shares',res.recommended_shares],['Position cost',`$${fmtNum(res.position_cost)}`],
         ['Max loss',`$${res.potential_loss}`],['1:2 target',`$${res.reward_target_1r2r?.toFixed(2)}`]]
        .map(([l,v])=>`<div class="bt-row"><span class="bt-lbl">${l}</span><span class="bt-val">${v}</span></div>`).join('')}
    </div>`;
}

// ─── PORTFOLIO ────────────────────────────────────────────────────────────────
function renderPortfolio(s) {
  s.innerHTML = `
    <div class="safe-top"></div>
    <div style="padding:0 20px 16px"><div style="font-size:22px;font-weight:800">Portfolio</div></div>
    <div id="port-content"><div class="loader"><div class="spinner"></div></div></div>`;
  loadPortfolio();
}

async function loadPortfolio() {
  const c = document.getElementById('port-content');
  if(!c) return;
  const p = await GET('/api/portfolio');
  if(!c) return;
  const initCap=10000;
  const totalPct=((p.total_value-initCap)/initCap*100);
  const tColor = totalPct>=0?'var(--green)':'var(--red)';

  c.innerHTML = `
    <div class="port-hero">
      <div class="lbl">Total Value</div>
      <div class="val">$${fmtNum(p.total_value||0)}</div>
      <div class="sub" style="color:${tColor}">${totalPct>=0?'+':''}${totalPct.toFixed(2)}% all time</div>
    </div>
    <div class="stats-row">
      <div class="stat-pill"><div class="val">$${fmtK(p.cash||0)}</div><div class="lbl">Cash</div></div>
      <div class="stat-pill"><div class="val">$${fmtK(p.positions_value||0)}</div><div class="lbl">Invested</div></div>
      <div class="stat-pill"><div class="val" style="color:${(p.realized_pnl||0)>=0?'var(--green)':'var(--red)'}">${(p.realized_pnl||0)>=0?'+':''}$${Math.abs(p.realized_pnl||0).toFixed(0)}</div><div class="lbl">Realized P&L</div></div>
    </div>
    ${p.positions?.length ? `
      <div class="section-header"><h2>Open Positions</h2></div>
      <div class="card" style="padding:4px 0">
        ${p.positions.map(pos=>{
          const pnlColor=pos.unrealized_pnl>=0?'var(--green)':'var(--red)';
          return `<div class="holding" onclick="openSymbol('${pos.symbol}')">
            ${coinIcon(pos.symbol,40)}
            <div class="hold-info">
              <div class="hold-name">${pos.symbol}</div>
              <div class="hold-shares">${pos.shares} shares · avg $${pos.avg_price?.toFixed(2)}</div>
            </div>
            <div class="hold-right">
              <div class="hold-val">$${fmtNum(pos.market_value)}</div>
              <div class="hold-pnl" style="color:${pnlColor}">${pos.unrealized_pnl>=0?'+':''}$${pos.unrealized_pnl?.toFixed(2)} (${pos.unrealized_pct>=0?'+':''}${pos.unrealized_pct?.toFixed(1)}%)</div>
            </div>
          </div>`;
        }).join('')}
      </div>` : `<div class="empty"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg><h3>No positions yet</h3><p>Go to Trade to buy your first asset</p></div>`}
    ${p.history?.length ? `
      <div class="section-header"><h2>Recent Trades</h2></div>
      <div class="card" style="padding:4px 0">
        ${p.history.slice().reverse().slice(0,10).map(t=>{
          const buy=t.action==='BUY';
          return `<div class="holding">
            ${coinIcon(t.symbol,36)}
            <div class="hold-info">
              <div class="hold-name" style="font-size:14px">${t.action} ${t.symbol}</div>
              <div class="hold-shares">${t.shares} shares · ${t.date?.slice(0,10)}</div>
            </div>
            <div class="hold-right">
              <div class="hold-val" style="font-size:14px">$${fmtNum(t.total||0)}</div>
              ${t.pnl!=null?`<div class="hold-pnl" style="color:${t.pnl>=0?'var(--green)':'var(--red)'}">${t.pnl>=0?'+':''}$${t.pnl?.toFixed(2)}</div>`:''}
            </div>
          </div>`;
        }).join('')}
      </div>` : ''}
    <div style="padding:16px 16px 32px">
      <button class="btn btn-ghost" onclick="confirmReset()">Reset to $10,000</button>
    </div>`;
}

function confirmReset(){
  if(!confirm('Reset portfolio to $10,000? This clears all positions and history.'))return;
  POST('/api/portfolio/reset',{capital:10000}).then(()=>{toast('Portfolio reset','ok');loadPortfolio();});
}

// ─── LEARN ────────────────────────────────────────────────────────────────────
function renderLearn(s) {
  if (learnView==='lesson') { renderLessonDetail(s); return; }
  if (learnView==='glossary') { renderGlossary(s); return; }

  const COLORS=['#4C7BF4','#00C48C','#F0B90B','#FF5B5B','#A855F7'];
  s.innerHTML = `
    <div class="safe-top"></div>
    <div style="padding:0 20px 16px">
      <div style="font-size:22px;font-weight:800">Learn</div>
      <div style="font-size:13px;color:var(--text3);margin-top:2px">Master trading, one lesson at a time</div>
    </div>
    <div id="lessons-wrap"><div class="loader"><div class="spinner"></div></div></div>
    <div class="section-header"><h2>Reference</h2></div>
    <div class="card" onclick="learnView='glossary';renderLearn(document.getElementById('screen'))" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-weight:700;margin-bottom:2px">Trading Glossary</div>
        <div style="font-size:12px;color:var(--text3)">30 essential terms defined</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div style="height:32px"></div>`;

  GET('/api/learn/lessons').then(lessons=>{
    const w = document.getElementById('lessons-wrap');
    if(!w) return;
    w.innerHTML = lessons.map((l,i)=>`
      <div class="lesson-card" onclick="openLesson(${l.id})">
        <div class="lesson-stripe" style="background:${COLORS[i%COLORS.length]}"></div>
        <div class="lesson-body">
          <div class="lesson-num">Lesson ${l.id}</div>
          <div class="lesson-title">${l.title}</div>
        </div>
        <div class="lesson-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>`).join('');
  });
}

async function openLesson(id) {
  const s = document.getElementById('screen');
  s.innerHTML = `<div class="loader" style="padding:100px"><div class="spinner"></div></div>`;
  const lesson = await GET(`/api/learn/lesson/${id}`);
  learnView = 'lesson';
  activeLesson = lesson;
  renderLessonDetail(s);
}

function renderLessonDetail(s) {
  const lesson = activeLesson;
  if (!lesson) { learnView='list'; renderLearn(s); return; }
  s.innerHTML = `
    <div class="safe-top"></div>
    <div class="back-btn" onclick="learnView='list';activeLesson=null;renderLearn(document.getElementById('screen'))">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Learn
    </div>
    <div style="padding:12px 20px 20px">
      <div style="font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px">Lesson ${lesson.id}</div>
      <div style="font-size:22px;font-weight:800">${lesson.title}</div>
    </div>
    <div class="card">
      <div class="lesson-content">${lesson.content}</div>
    </div>
    <div class="section-header"><h2>Quiz</h2></div>
    <div style="padding:0 16px 32px">
      ${lesson.quiz.map((q,qi)=>`
        <div style="margin-bottom:24px">
          <div style="font-weight:700;margin-bottom:12px;font-size:15px;line-height:1.5">${q.q}</div>
          ${q.options.map(opt=>`<button class="quiz-opt" onclick="answerQuiz(this,'${opt[0]}','${q.answer}',${qi})">${opt}</button>`).join('')}
          <div id="qfb-${qi}" style="font-size:13px;margin-top:4px;min-height:18px"></div>
        </div>`).join('')}
    </div>`;
}

function answerQuiz(btn, chosen, correct, qi) {
  btn.parentElement.querySelectorAll('.quiz-opt').forEach(b=>{b.disabled=true;});
  if(chosen===correct){
    btn.classList.add('correct');
    document.getElementById(`qfb-${qi}`).innerHTML=`<span style="color:var(--green)">✓ Correct!</span>`;
    toast('Correct! 🎯','ok');
  } else {
    btn.classList.add('wrong');
    btn.parentElement.querySelectorAll('.quiz-opt').forEach(b=>{
      if(b.textContent.trim().startsWith(correct)) b.classList.add('correct');
    });
    document.getElementById(`qfb-${qi}`).innerHTML=`<span style="color:var(--red)">Answer: ${correct}</span>`;
    toast('Not quite — check the answer','err');
  }
}

async function renderGlossary(s) {
  s.innerHTML = `
    <div class="safe-top"></div>
    <div class="back-btn" onclick="learnView='list';renderLearn(document.getElementById('screen'))">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Learn
    </div>
    <div style="padding:12px 20px 16px"><div style="font-size:22px;font-weight:800">Glossary</div></div>
    <div class="search-box">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="g-search" placeholder="Search terms…" oninput="filterGlossary()"/>
    </div>
    <div class="card" id="g-list" style="padding:4px 0"><div class="loader"><div class="spinner"></div></div></div>
    <div style="height:32px"></div>`;

  const terms = await GET('/api/learn/glossary');
  _glossaryTerms = terms;
  renderGlossaryList(terms);
}

function filterGlossary(){
  const q=(document.getElementById('g-search')?.value||'').toLowerCase();
  renderGlossaryList(_glossaryTerms.filter(t=>t.term.toLowerCase().includes(q)||t.definition.toLowerCase().includes(q)));
}
function renderGlossaryList(terms){
  const el=document.getElementById('g-list'); if(!el) return;
  el.innerHTML=terms.map(t=>`<div class="gitem"><div class="gterm">${t.term}</div><div class="gdef">${t.definition}</div></div>`).join('');
}

// ─── Formatters ───────────────────────────────────────────────────────────────
function fmtPrice(n) {
  if(n==null) return '—';
  if(n>=1000) return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(n>=10)   return n.toFixed(2);
  if(n>=1)    return n.toFixed(3);
  return n.toFixed(4);
}
function fmtNum(n) {
  if(n==null) return '—';
  return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtK(n) {
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return n.toFixed(0);
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
render();
</script>
